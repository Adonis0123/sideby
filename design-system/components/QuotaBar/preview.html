<!-- @dsCard group="Status" height=150 subtitle="Static rendition of the Panel's .bar and level rules" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><style>body{padding:20px;display:grid;gap:14px;max-width:360px}.meter{display:grid;grid-template-columns:auto 1fr;column-gap:6px;font-size:var(--small)}.m-label{color:var(--muted)}.m-pct{justify-self:end;font-weight:var(--strong-weight)}.bar{grid-column:1/3}</style></head>
<body>
<div class="meter"><span class="m-label">5 h window</span><span class="m-pct">34% used</span><div class="bar"><span style="width:34%"></span></div></div>
<div class="meter lvl-warn"><span class="m-label">Weekly</span><span class="m-pct">86% used</span><div class="bar"><span style="width:86%"></span></div></div>
<div class="meter lvl-fail"><span class="m-label">Weekly</span><span class="m-pct">100% used</span><div class="bar"><span style="width:100%"></span></div></div>
</body></html>
