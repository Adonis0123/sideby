name: Release

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use npm 11.5.1 or later (needed for trusted publishing)
        run: |
          npm install -g npm@11.21.0 # pinned: this job holds id-token: write; bump deliberately
          npm -v
          node -e '
            const v = process.argv[1]
            const [a, b, c] = v.split(".").map(Number)
            if (!(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))))) {
              console.error("::error::npm " + v + " is older than 11.5.1; trusted publishing needs 11.5.1 or later.")
              process.exit(1)
            }
          ' "$(npm -v)"

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Tag matches package.json version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$expected" ]; then
            echo "::error::Tag $TAG does not match package.json ($expected). Delete the tag and release with 'npm version'."
            exit 1
          fi

      # The tag sits on the version commit made by `npm version`, one commit after a main that CI already checked.
      # When CI passed on that parent and the version commit only bumps the version, the same checks need not run
      # again; anything else runs them here.
      - name: Reuse main's CI result
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          parent="$(git rev-parse HEAD^)"
          extra="$(git diff --name-only HEAD^ HEAD | grep -vxE 'package\.json|skills/sideby/SKILL\.md' || true)"
          # Inside those two files, every changed line must be a version line.
          lines="$(git diff -U0 HEAD^ HEAD -- package.json skills/sideby/SKILL.md | grep -E '^[+-]' | grep -vE '^(\+\+\+|---) ' | grep -vE '^[+-] *("version": |version: )' || true)"
          if [ -n "$lines" ]; then extra="${extra:+$extra }(lines other than the version)"; fi
          passed="$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$parent&status=success&per_page=1" --jq .total_count || echo 0)"
          if [ -z "$extra" ] && [ "$passed" -gt 0 ]; then
            echo "::notice::CI passed on $parent and the version commit only bumps the version; skipping pnpm check."
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "CI result reused: no (changes beyond the version bump: ${extra:-none}; passing CI runs on $parent: $passed)"
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi

      - run: pnpm check
        if: steps.ci.outputs.passed != 'true'

      # The one check main's CI cannot cover: the version commit keeps package.json and the skill on one version.
      - run: node --test src/core/skill-version.test.ts
        if: steps.ci.outputs.passed == 'true'

      - run: pnpm build

      - name: Skip if this version is already on npm
        id: npm
        run: |
          spec="$(node -p "const p = require('./package.json'); p.name + '@' + p.version")"
          if npm view "$spec" version >/dev/null 2>&1; then
            echo "::notice::$spec is already on npm (first release is published by hand); skipping npm publish."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # Trusted publishing: npm exchanges the OIDC token for a short-lived credential and adds provenance.
      # The script pins README.md as the registry readme. A bare `npm publish` would store README.zh-CN.md.
      - name: Publish to npm
        if: steps.npm.outputs.published == 'false'
        run: node scripts/pin-english-npm-readme.ts --publish

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - run: npx --yes changelogithub@15.0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
