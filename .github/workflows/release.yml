name: Release

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use npm 11.5.1 or later (needed for trusted publishing)
        run: |
          npm install -g npm@11.21.0 # pinned: this job holds id-token: write; bump deliberately
          npm -v
          node -e '
            const v = process.argv[1]
            const [a, b, c] = v.split(".").map(Number)
            if (!(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))))) {
              console.error("::error::npm " + v + " is older than 11.5.1; trusted publishing needs 11.5.1 or later.")
              process.exit(1)
            }
          ' "$(npm -v)"

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Tag matches package.json version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$expected" ]; then
            echo "::error::Tag $TAG does not match package.json ($expected). Delete the tag and release with 'npm version'."
            exit 1
          fi

      - run: pnpm check

      - run: pnpm build

      - name: Skip if this version is already on npm
        id: npm
        run: |
          spec="$(node -p "const p = require('./package.json'); p.name + '@' + p.version")"
          if npm view "$spec" version >/dev/null 2>&1; then
            echo "::notice::$spec is already on npm (first release is published by hand); skipping npm publish."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # Trusted publishing: npm exchanges the OIDC token for a short-lived credential and adds provenance.
      - name: Publish to npm
        if: steps.npm.outputs.published == 'false'
        run: npm publish --access public

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - run: npx --yes changelogithub@15.0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
