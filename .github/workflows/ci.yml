name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22.x, 24.x]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - run: pnpm build

      - name: Schemas are up to date
        run: |
          pnpm schemas
          git add --intent-to-add schemas
          if ! git diff --exit-code -- schemas; then
            echo "::error::schemas/ is stale. Run 'pnpm schemas' locally and commit the result."
            exit 1
          fi

      - name: Package contents
        run: |
          npm pack --dry-run
          npm pack --dry-run --json | node -e '
            const [pkg] = JSON.parse(require("fs").readFileSync(0, "utf8"))
            const bad = pkg.files.map((f) => f.path).filter((p) => p.endsWith(".ts") && !p.endsWith(".d.ts"))
            if (bad.length) {
              console.error("::error::TypeScript sources would be published: " + bad.join(", ") + ". Check \"files\" in package.json and tsconfig.build.json.")
              process.exit(1)
            }
          '
