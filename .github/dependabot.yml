version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: '⬆️ chore'
      include: scope

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: '⬆️ chore'
      include: scope
    ignore:
      # Keep @types/node on the major of engines.node; raise both together by hand.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
